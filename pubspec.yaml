name: KhanepaniApp
description: A water utility management application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  local_auth: ^2.1.6 
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  intl: ^0.18.1
  shared_preferences: ^2.2.2
  image_picker: ^1.0.4
  camera: ^0.10.5
  flutter_svg: ^2.0.9
  provider: ^6.1.1
  flutter_secure_storage: ^9.0.0
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  nepali_utils: ^3.0.8
  path_provider: ^2.1.0
  share_plus: ^7.2.1
  pdf: ^3.10.4
  printing: ^5.11.0
  open_file: ^3.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/mangal.ttf
    - assets/fonts/Kalimati Regular.otf